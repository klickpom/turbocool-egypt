name: Deploy Turbo Cool to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Project
        run: npm run build

      - name: Verify production bundle
        run: |
          test -f dist/index.html
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/ai.txt
          test -f dist/schema.jsonld
          test -f dist/sitemap.xml
          test -f dist/.htaccess
          ls dist/assets/*.js
          grep -q "01097640898" dist/assets/*.js
          grep -q "53KHEFT12N8-708F" dist/assets/*.js
          grep -q "2607098443095837" dist/index.html
          grep -q "أفضل شركة تكييفات 2026" dist/index.html
          grep -q "/products" dist/sitemap.xml
          grep -q "FAQPage" dist/schema.jsonld

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 82.198.227.38
          username: u541491486
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
